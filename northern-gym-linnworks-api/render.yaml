services:
  - type: web
    name: northern-gym-linnworks-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SERVICE_ENABLED
        value: 'true'
      - key: AUTO_REPLY_ENABLED
        value: 'true'
      - key: MAX_CANDIDATES
        value: '40'
      - key: API_BEARER_TOKEN
        sync: false
      - key: LINNWORKS_APP_ID
        sync: false
      - key: LINNWORKS_APP_SECRET
        sync: false
      - key: LINNWORKS_PERMANENT_TOKEN
        sync: false
